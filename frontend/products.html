<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Products</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared Navbar Wrapper -->
  <div id="navbar"></div>

  <div class="container">
    <h2>Explore Products</h2>

    <!-- Controls: Search, Categories, Sort -->
    <div class="catalog-controls">
      <!-- Search Input -->
      <div class="search-box">
        <input type="text" id="search-input" class="form-control" placeholder="Search products by name or description...">
      </div>

      <!-- Price Sort -->
      <div class="sort-box">
        <select id="sort-select" class="form-control">
          <option value="default">Sort: Default</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
          <option value="newest">Newest First</option>
        </select>
      </div>
    </div>

    <!-- Category Pills Filter -->
    <div class="filter-categories" id="categories-container" style="margin-bottom: 25px;">
      <!-- JavaScript will inject pills here -->
    </div>

    <!-- Loading Spinner -->
    <div id="catalog-loading" class="spinner"></div>

    <!-- Product Grid -->
    <div class="product-grid" id="catalog-grid" style="display: none;"></div>

    <!-- Error Alert -->
    <div id="catalog-error" style="display: none; color: var(--danger); text-align: center; margin: 20px 0;"></div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a> | 
      <a href="products.html">Products</a> | 
      <a href="cart.html">Cart</a> | 
      <a href="wishlist.html">Wishlist</a>
    </div>
    <p>&copy; 2026 ShopEasy Inc. All rights reserved.</p>
  </footer>

  <script src="api.js"></script>
  <script src="navbar.js"></script>

  <script>
    let allProducts = [];
    let wishlistedIds = new Set();
    let selectedCategory = "all";

    document.addEventListener("DOMContentLoaded", () => {
      initCatalog();
    });

    async function initCatalog() {
      const searchInput = document.getElementById("search-input");
      const sortSelect = document.getElementById("sort-select");
      
      // Hook event listeners
      searchInput.addEventListener("input", filterAndRender);
      sortSelect.addEventListener("change", filterAndRender);

      await fetchWishlist(); // load wishlist if logged in
      await fetchCategories();
      await fetchProducts();
    }

    async function fetchWishlist() {
      if (!getToken()) return;
      try {
        const wishlist = await apiFetch("/api/wishlist");
        if (wishlist && Array.isArray(wishlist)) {
          wishlist.forEach(item => {
            wishlistedIds.add(item.product_id);
          });
        }
      } catch (err) {
        console.error("Failed to load wishlist:", err);
      }
    }

    async function fetchCategories() {
      const container = document.getElementById("categories-container");
      try {
        const categories = await apiFetch("/api/products/categories");
        
        container.innerHTML = `<button class="btn btn-primary category-pill active" data-category="all" style="padding: 6px 16px; font-size: 13px;">All</button>`;
        
        categories.forEach(cat => {
          const btn = document.createElement("button");
          btn.className = "btn btn-secondary category-pill";
          btn.style.padding = "6px 16px";
          btn.style.fontSize = "13px";
          btn.style.marginLeft = "8px";
          btn.setAttribute("data-category", cat);
          btn.textContent = cat;
          container.appendChild(btn);
        });

        // Add click handlers
        const pills = container.querySelectorAll(".category-pill");
        pills.forEach(pill => {
          pill.addEventListener("click", () => {
            pills.forEach(p => {
              p.classList.remove("btn-primary", "active");
              p.classList.add("btn-secondary");
            });
            pill.classList.remove("btn-secondary");
            pill.classList.add("btn-primary", "active");
            
            selectedCategory = pill.getAttribute("data-category");
            filterAndRender();
          });
        });

      } catch (err) {
        console.error("Failed to load categories:", err);
      }
    }

    async function fetchProducts() {
      const loadingEl = document.getElementById("catalog-loading");
      const gridEl = document.getElementById("catalog-grid");
      const errorEl = document.getElementById("catalog-error");

      try {
        allProducts = await apiFetch("/api/products");
        loadingEl.style.display = "none";
        filterAndRender();
      } catch (err) {
        loadingEl.style.display = "none";
        errorEl.textContent = "Failed to load products: " + err.message;
        errorEl.style.display = "block";
      }
    }

    function filterAndRender() {
      const query = document.getElementById("search-input").value.toLowerCase().trim();
      const sortBy = document.getElementById("sort-select").value;
      const gridEl = document.getElementById("catalog-grid");

      let filtered = [...allProducts];

      // 1. Category Filter
      if (selectedCategory !== "all") {
        filtered = filtered.filter(p => p.category === selectedCategory);
      }

      // 2. Search query filter
      if (query) {
        filtered = filtered.filter(p => 
          p.name.toLowerCase().includes(query) || 
          (p.description && p.description.toLowerCase().includes(query))
        );
      }

      // 3. Sorting
      if (sortBy === "price_asc") {
        filtered.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
      } else if (sortBy === "price_desc") {
        filtered.sort((a, b) => parseFloat(b.price) - parseFloat(a.price));
      } else if (sortBy === "newest") {
        filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      // 4. Render Grid
      gridEl.innerHTML = "";
      if (filtered.length === 0) {
        gridEl.style.display = "none";
        document.getElementById("catalog-error").textContent = "No products match your criteria.";
        document.getElementById("catalog-error").style.display = "block";
        return;
      }

      document.getElementById("catalog-error").style.display = "none";
      
      filtered.forEach(prod => {
        const card = document.createElement("div");
        card.className = "product-card";
        
        const fullStars = Math.round(prod.avg_rating);
        let starsStr = "";
        for (let i = 1; i <= 5; i++) {
          starsStr += i <= fullStars ? "★" : "☆";
        }

        const isWish = wishlistedIds.has(prod.id) ? "active" : "";
        const heartChar = wishlistedIds.has(prod.id) ? "♥" : "♡";
        const imageUrl = prod.image_url || "https://images.unsplash.com/photo-1523275335684-37898b6baf30";

        card.innerHTML = `
          <div class="product-card-img-wrapper">
            <a href="product.html?id=${prod.id}">
              <img src="${imageUrl}" alt="${prod.name}" class="product-card-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30'">
            </a>
            <button class="wishlist-toggle-btn ${isWish}" data-id="${prod.id}">${heartChar}</button>
          </div>
          <div class="product-card-body">
            <div class="product-card-category">${prod.category}</div>
            <a href="product.html?id=${prod.id}" style="color: inherit; text-decoration: none;">
              <h3 class="product-card-title">${prod.name}</h3>
            </a>
            <div class="product-card-rating">
              <span class="stars">${starsStr}</span>
              <span class="rating-count">(${prod.review_count})</span>
            </div>
            <div class="product-card-footer">
              <div class="product-card-price">₹${parseFloat(prod.price).toFixed(2)}</div>
              <button class="btn btn-primary add-to-cart-btn" data-id="${prod.id}">Add</button>
            </div>
          </div>
        `;
        gridEl.appendChild(card);
      });

      gridEl.style.display = "grid";
      setupCartActions();
      setupWishlistActions();
    }

    function setupCartActions() {
      const buttons = document.querySelectorAll(".add-to-cart-btn");
      buttons.forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          const productId = parseInt(btn.getAttribute("data-id"));
          
          if (!getToken()) {
            showToast("Login required to add items to cart!", "error");
            setTimeout(() => { window.location = "login.html"; }, 1000);
            return;
          }

          try {
            btn.disabled = true;
            btn.textContent = "Adding...";
            await apiFetch("/api/cart", {
              method: "POST",
              body: JSON.stringify({ product_id: productId, quantity: 1 })
            });
            showToast("Added to cart!", "success");
            if (window.updateNavbarCartBadge) await window.updateNavbarCartBadge();
          } catch (err) {
            showToast("Could not add to cart: " + err.message, "error");
          } finally {
            btn.disabled = false;
            btn.textContent = "Add";
          }
        });
      });
    }

    function setupWishlistActions() {
      const buttons = document.querySelectorAll(".wishlist-toggle-btn");
      buttons.forEach(btn => {
        btn.addEventListener("click", async (e) => {
          e.preventDefault();
          const productId = parseInt(btn.getAttribute("data-id"));

          if (!getToken()) {
            showToast("Login required to add to wishlist!", "error");
            setTimeout(() => { window.location = "login.html"; }, 1000);
            return;
          }

          const isActive = btn.classList.contains("active");
          try {
            btn.disabled = true;
            if (isActive) {
              // Remove from wishlist
              await apiFetch(`/api/wishlist/${productId}`, {
                method: "DELETE"
              });
              wishlistedIds.delete(productId);
              btn.classList.remove("active");
              btn.textContent = "♡";
              showToast("Removed from wishlist!", "info");
            } else {
              // Add to wishlist
              await apiFetch("/api/wishlist", {
                method: "POST",
                body: JSON.stringify({ product_id: productId })
              });
              wishlistedIds.add(productId);
              btn.classList.add("active");
              btn.textContent = "♥";
              showToast("Added to wishlist!", "success");
            }
          } catch (err) {
            showToast("Error updating wishlist: " + err.message, "error");
          } finally {
            btn.disabled = false;
          }
        });
      });
    }
  </script>
</body>
</html>
