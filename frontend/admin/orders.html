<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy Admin - Manage Orders</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="sidebar-brand">
      🛍️ <span>ShopEasy Admin</span>
    </div>
    <ul class="sidebar-menu">
      <li class="sidebar-item"><a href="index.html">📊 <span>Dashboard</span></a></li>
      <li class="sidebar-item"><a href="products.html">📦 <span>Products</span></a></li>
      <li class="sidebar-item active"><a href="orders.html">📜 <span>Orders</span></a></li>
      <li class="sidebar-item"><a href="users.html">👥 <span>Users</span></a></li>
      <li class="sidebar-item"><a href="promos.html">🎟️ <span>Promos</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <li class="sidebar-item" style="list-style: none;"><a href="../index.html">🏪 <span>View Store</span></a></li>
      <li class="sidebar-item" style="list-style: none;"><a href="#" id="admin-logout-btn">🚪 <span>Logout</span></a></li>
    </div>
  </div>

  <!-- Main Content Panel -->
  <div class="main-content">
    <div class="page-header">
      <div class="page-title">
        <h1>Manage Orders</h1>
      </div>
      <button class="btn btn-secondary" id="export-csv-btn">📤 Export orders (CSV)</button>
    </div>

    <!-- Controls: Status Filter -->
    <div class="table-card" style="padding: 15px 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: flex-start; gap: 15px;">
      <label for="status-filter" style="font-size: 14px; font-weight: 500; color: var(--text-muted);">Filter by Status:</label>
      <select id="status-filter" class="form-control" style="width: 200px;">
        <option value="all">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <!-- Loading Spinner -->
    <div id="orders-loading" class="spinner"></div>

    <!-- Orders Card Table -->
    <div class="table-card" id="orders-table-card" style="display: none;">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Order#</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Items</th>
              <th>Total</th>
              <th>Payment</th>
              <th>Status</th>
              <th style="text-align: right; width: 160px;">Update Status</th>
            </tr>
          </thead>
          <tbody id="orders-table-body">
            <!-- JavaScript will inject rows here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../api.js"></script>
  <script>
    let currentFilter = "all";

    document.addEventListener("DOMContentLoaded", () => {
      // 1. Verify admin auth
      const user = getUser();
      if (!getToken() || !user || user.role !== "admin") {
        localStorage.clear();
        window.location = "../login.html";
        return;
      }

      // 2. Setup logout
      document.getElementById("admin-logout-btn").onclick = (e) => {
        e.preventDefault();
        localStorage.clear();
        window.location = "../index.html";
      };

      // 3. Filter Controls
      document.getElementById("status-filter").addEventListener("change", (e) => {
        currentFilter = e.target.value;
        loadOrders();
      });

      // 4. Export CSV Control
      document.getElementById("export-csv-btn").onclick = handleExportCSV;

      loadOrders();
    });

    async function loadOrders() {
      const loader = document.getElementById("orders-loading");
      const cardTable = document.getElementById("orders-table-card");
      const tbody = document.getElementById("orders-table-body");

      loader.style.display = "block";
      cardTable.style.display = "none";

      try {
        // Build url based on filter
        let url = "/api/admin/orders";
        if (currentFilter !== "all") {
          url += `?status_filter=${currentFilter}`;
        }

        const orders = await apiFetch(url);
        loader.style.display = "none";
        tbody.innerHTML = "";

        if (orders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">No orders found.</td></tr>`;
        } else {
          orders.forEach(ord => {
            const tr = document.createElement("tr");

            const orderDate = new Date(ord.created_at).toLocaleDateString(undefined, {
              year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            // Status Badge Check
            let badgeClass = "badge-gray";
            if (ord.status === "pending") badgeClass = "badge-warning";
            else if (ord.status === "confirmed") badgeClass = "badge-info";
            else if (ord.status === "shipped") badgeClass = "badge-info";
            else if (ord.status === "delivered") badgeClass = "badge-success";
            else if (ord.status === "cancelled") badgeClass = "badge-danger";

            // Items list summary
            let itemsSummary = "";
            ord.items.forEach(item => {
              itemsSummary += `<div style="font-size: 12px; margin-bottom: 2px;">${item.product.name} <strong>x${item.quantity}</strong></div>`;
            });

            // Build status dropdown options
            const statuses = ["pending", "confirmed", "shipped", "delivered", "cancelled"];
            let dropdownOptions = "";
            statuses.forEach(st => {
              const selected = ord.status === st ? "selected" : "";
              dropdownOptions += `<option value="${st}" ${selected}>${st.toUpperCase()}</option>`;
            });

            tr.innerHTML = `
              <td style="font-weight: 700; color: var(--primary);">${ord.order_number}</td>
              <td>
                <div style="font-weight: 600;">${ord.user.full_name}</div>
                <div style="font-size: 11px; color: var(--text-muted);">${ord.user.email}</div>
              </td>
              <td style="font-size: 12px; white-space: nowrap;">${orderDate}</td>
              <td>${itemsSummary}</td>
              <td style="font-weight: 700;">₹${parseFloat(ord.total).toFixed(2)}</td>
              <td style="font-size: 12px;">${ord.payment_method}</td>
              <td><span class="badge ${badgeClass}">${ord.status}</span></td>
              <td style="text-align: right;">
                <select class="form-control status-update-select" data-id="${ord.id}" style="font-size: 12px; padding: 4px 8px;">
                  ${dropdownOptions}
                </select>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        cardTable.style.display = "block";
        setupDropdownListeners();

      } catch (err) {
        loader.style.display = "none";
        alert("Failed to load orders: " + err.message);
      }
    }

    function setupDropdownListeners() {
      document.querySelectorAll(".status-update-select").forEach(select => {
        select.addEventListener("change", async (e) => {
          const orderId = parseInt(select.getAttribute("data-id"));
          const newStatus = select.value;
          
          if (confirm(`Update order status to ${newStatus.toUpperCase()}?`)) {
            try {
              select.disabled = true;
              await apiFetch(`/api/admin/orders/${orderId}/status`, {
                method: "PUT",
                body: JSON.stringify({ status: newStatus })
              });
              alert("Order status updated successfully!");
              loadOrders();
            } catch (err) {
              alert("Failed to update status: " + err.message);
              loadOrders(); // reset select
            }
          } else {
            loadOrders(); // reset select
          }
        });
      });
    }

    async function handleExportCSV() {
      const btn = document.getElementById("export-csv-btn");
      try {
        btn.disabled = true;
        btn.textContent = "Exporting...";

        const blob = await apiFetch("/api/admin/orders/export");
        if (blob instanceof Blob) {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.style.display = "none";
          a.href = url;
          a.download = `orders_${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          a.remove();
          showToast("Orders exported successfully!", "success");
        } else {
          alert("Export failed: response was not a valid CSV file blob.");
        }
      } catch (err) {
        alert("Failed to export orders: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "📤 Export orders (CSV)";
      }
    }
  </script>
</body>
</html>
