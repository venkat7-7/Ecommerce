<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy Admin - Manage Products</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- Left Sidebar -->
  <div class="sidebar">
    <div class="sidebar-brand">
      🛍️ <span>ShopEasy Admin</span>
    </div>
    <ul class="sidebar-menu">
      <li class="sidebar-item"><a href="index.html">📊 <span>Dashboard</span></a></li>
      <li class="sidebar-item active"><a href="products.html">📦 <span>Products</span></a></li>
      <li class="sidebar-item"><a href="orders.html">📜 <span>Orders</span></a></li>
      <li class="sidebar-item"><a href="users.html">👥 <span>Users</span></a></li>
      <li class="sidebar-item"><a href="promos.html">🎟️ <span>Promos</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <li class="sidebar-item" style="list-style: none;"><a href="../index.html">🏪 <span>View Store</span></a></li>
      <li class="sidebar-item" style="list-style: none;"><a href="#" id="admin-logout-btn">🚪 <span>Logout</span></a></li>
    </div>
  </div>

  <!-- Main Content Panel -->
  <div class="main-content">
    <div class="page-header">
      <div class="page-title">
        <h1>Manage Products</h1>
      </div>
      <button class="btn btn-primary" id="open-add-modal-btn">➕ Add New Product</button>
    </div>

    <!-- Loading Spinner -->
    <div id="products-loading" class="spinner"></div>

    <!-- Products Card Table -->
    <div class="table-card" id="products-table-card" style="display: none;">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Price</th>
              <th>Stock</th>
              <th>Status</th>
              <th style="text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="products-table-body">
            <!-- JavaScript will inject rows here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add/Edit Product Modal Backdrop -->
  <div class="modal-backdrop" id="product-modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Add New Product</h3>
        <button class="close-btn" id="close-modal-btn">&times;</button>
      </div>
      <form id="product-form">
        <input type="hidden" id="product-id-field">
        <div class="modal-body">
          <div class="form-group">
            <label for="prod-name">Product Name *</label>
            <input type="text" id="prod-name" class="form-control" required placeholder="e.g. Wireless Mouse">
          </div>

          <div class="form-group">
            <label for="prod-desc">Description</label>
            <textarea id="prod-desc" class="form-control" rows="3" placeholder="Enter product description..."></textarea>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
              <label for="prod-price">Price (₹) *</label>
              <input type="number" step="0.01" min="0.01" id="prod-price" class="form-control" required placeholder="499.00">
            </div>
            <div class="form-group">
              <label for="prod-stock">Stock Quantity *</label>
              <input type="number" min="0" id="prod-stock" class="form-control" required placeholder="50">
            </div>
          </div>

          <div class="form-group">
            <label for="prod-category">Category *</label>
            <input type="text" id="prod-category" class="form-control" required placeholder="e.g. Electronics">
          </div>

          <div class="form-group">
            <label for="prod-image-url">Image URL</label>
            <input type="url" id="prod-image-url" class="form-control" placeholder="https://example.com/image.jpg">
          </div>

          <div class="form-group">
            <label>
              <input type="checkbox" id="prod-active" checked style="margin-right: 8px;">
              Active (Visible in Store)
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="save-product-btn">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../api.js"></script>
  <script>
    let productsList = [];

    document.addEventListener("DOMContentLoaded", () => {
      // 1. Verify admin auth
      const user = getUser();
      if (!getToken() || !user || user.role !== "admin") {
        localStorage.clear();
        window.location = "../login.html";
        return;
      }

      // 2. Setup logout
      document.getElementById("admin-logout-btn").onclick = (e) => {
        e.preventDefault();
        localStorage.clear();
        window.location = "../index.html";
      };

      // 3. Modal Controls
      document.getElementById("open-add-modal-btn").onclick = () => openModal();
      document.getElementById("close-modal-btn").onclick = closeModal;
      document.getElementById("cancel-modal-btn").onclick = closeModal;
      document.getElementById("product-form").onsubmit = handleSaveProduct;

      loadProducts();
    });

    async function loadProducts() {
      const loader = document.getElementById("products-loading");
      const cardTable = document.getElementById("products-table-card");
      const tbody = document.getElementById("products-table-body");

      try {
        productsList = await apiFetch("/api/admin/products");
        loader.style.display = "none";
        tbody.innerHTML = "";

        if (productsList.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">No products registered yet.</td></tr>`;
        } else {
          productsList.forEach(p => {
            const tr = document.createElement("tr");
            
            // Stock badge check
            let stockBadgeClass = "badge-success";
            if (p.stock_quantity < 5) {
              stockBadgeClass = "badge-danger";
            } else if (p.stock_quantity <= 10) {
              // Custom warning style for yellow
              stockBadgeClass = "badge-warning";
            }

            const activeBadgeClass = p.is_active ? "badge-success" : "badge-gray";
            const activeText = p.is_active ? "Active" : "Inactive";
            const imageUrl = p.image_url || "https://images.unsplash.com/photo-1523275335684-37898b6baf30";

            tr.innerHTML = `
              <td>${p.id}</td>
              <td>
                <img src="${imageUrl}" alt="${p.name}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border);" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30'">
              </td>
              <td style="font-weight: 600;">${p.name}</td>
              <td>${p.category}</td>
              <td style="font-weight: 500;">₹${parseFloat(p.price).toFixed(2)}</td>
              <td><span class="badge ${stockBadgeClass}">${p.stock_quantity}</span></td>
              <td><span class="badge ${activeBadgeClass}">${activeText}</span></td>
              <td style="text-align: right;">
                <button class="btn btn-secondary edit-btn" style="padding: 4px 8px; font-size: 12px;" data-id="${p.id}">Edit</button>
                <button class="btn btn-danger delete-btn" style="padding: 4px 8px; font-size: 12px;" data-id="${p.id}">Delete</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        cardTable.style.display = "block";
        setupTableActions();

      } catch (err) {
        loader.style.display = "none";
        alert("Failed to load products: " + err.message);
      }
    }

    function setupTableActions() {
      // Edit button handler
      document.querySelectorAll(".edit-btn").forEach(btn => {
        btn.onclick = () => {
          const productId = parseInt(btn.getAttribute("data-id"));
          const product = productsList.find(p => p.id === productId);
          if (product) {
            openModal(product);
          }
        };
      });

      // Delete button handler (Soft Delete)
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.onclick = async () => {
          const productId = parseInt(btn.getAttribute("data-id"));
          const product = productsList.find(p => p.id === productId);
          if (confirm(`Are you sure you want to delete "${product.name}"? (This will set active status to False)`)) {
            try {
              btn.disabled = true;
              await apiFetch(`/api/admin/products/${productId}`, {
                method: "DELETE"
              });
              alert("Product deleted successfully!");
              loadProducts();
            } catch (err) {
              alert("Failed to delete product: " + err.message);
              btn.disabled = false;
            }
          }
        };
      });
    }

    function openModal(prod = null) {
      const modal = document.getElementById("product-modal");
      const title = document.getElementById("modal-title");
      const form = document.getElementById("product-form");
      
      form.reset();

      if (prod) {
        title.textContent = "Edit Product details";
        document.getElementById("product-id-field").value = prod.id;
        document.getElementById("prod-name").value = prod.name;
        document.getElementById("prod-desc").value = prod.description || "";
        document.getElementById("prod-price").value = prod.price;
        document.getElementById("prod-stock").value = prod.stock_quantity;
        document.getElementById("prod-category").value = prod.category;
        document.getElementById("prod-image-url").value = prod.image_url || "";
        document.getElementById("prod-active").checked = prod.is_active;
      } else {
        title.textContent = "Add New Product";
        document.getElementById("product-id-field").value = "";
        document.getElementById("prod-active").checked = true;
      }

      modal.style.display = "flex";
    }

    function closeModal() {
      document.getElementById("product-modal").style.display = "none";
    }

    async function handleSaveProduct(e) {
      e.preventDefault();
      
      const saveBtn = document.getElementById("save-product-btn");
      const productId = document.getElementById("product-id-field").value;
      
      const payload = {
        name: document.getElementById("prod-name").value.trim(),
        description: document.getElementById("prod-desc").value.trim() || null,
        price: parseFloat(document.getElementById("prod-price").value),
        stock_quantity: parseInt(document.getElementById("prod-stock").value),
        category: document.getElementById("prod-category").value.trim(),
        image_url: document.getElementById("prod-image-url").value.trim() || null,
        is_active: document.getElementById("prod-active").checked
      };

      try {
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving...";

        if (productId) {
          // Edit existing product
          await apiFetch(`/api/admin/products/${productId}`, {
            method: "PUT",
            body: JSON.stringify(payload)
          });
          alert("Product updated successfully!");
        } else {
          // Add new product
          await apiFetch("/api/admin/products", {
            method: "POST",
            body: JSON.stringify(payload)
          });
          alert("Product added successfully!");
        }

        closeModal();
        loadProducts();

      } catch (err) {
        alert("Failed to save product: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Product";
      }
    }
  </script>
</body>
</html>
