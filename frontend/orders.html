<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - My Orders</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared Navbar Wrapper -->
  <div id="navbar"></div>

  <div class="container" style="max-width: 800px;">
    <h2>My Order History</h2>

    <!-- Loading Spinner -->
    <div id="orders-loading" class="spinner"></div>
    <div id="orders-error" style="display: none; color: var(--danger); text-align: center; margin: 20px 0;"></div>

    <!-- Empty Orders list -->
    <div id="orders-empty" class="card" style="display: none; text-align: center; padding: 40px; margin-top: 20px;">
      <p style="font-size: 16px; margin-bottom: 20px;">You haven't placed any orders yet.</p>
      <a href="products.html" class="btn btn-primary">Start Shopping</a>
    </div>

    <!-- Orders Cards container -->
    <div id="orders-list-container" style="display: none; margin-top: 25px;">
      <!-- JavaScript will inject orders here -->
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a> | 
      <a href="products.html">Products</a> | 
      <a href="cart.html">Cart</a> | 
      <a href="wishlist.html">Wishlist</a>
    </div>
    <p>&copy; 2026 ShopEasy Inc. All rights reserved.</p>
  </footer>

  <script src="api.js"></script>
  <script src="navbar.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!getToken()) {
        showToast("Login required to view order history!", "error");
        setTimeout(() => { window.location = "login.html"; }, 1000);
        return;
      }

      loadOrdersPage();
    });

    async function loadOrdersPage() {
      const loader = document.getElementById("orders-loading");
      const errorEl = document.getElementById("orders-error");
      const emptyEl = document.getElementById("orders-empty");
      const container = document.getElementById("orders-list-container");

      try {
        const orders = await apiFetch("/api/orders");
        loader.style.display = "none";

        if (!orders || orders.length === 0) {
          emptyEl.style.display = "block";
          container.style.display = "none";
          return;
        }

        emptyEl.style.display = "none";
        renderOrders(orders);
        container.style.display = "block";

      } catch (err) {
        loader.style.display = "none";
        errorEl.textContent = "Failed to load orders: " + err.message;
        errorEl.style.display = "block";
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById("orders-list-container");
      container.innerHTML = "";

      orders.forEach(order => {
        const orderCard = document.createElement("div");
        orderCard.className = "order-card";

        const orderDate = new Date(order.created_at).toLocaleDateString(undefined, {
          year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        // Status Badge Style
        let statusClass = `status-${order.status}`;
        
        // Items render
        let itemsHtml = "";
        order.items.forEach(item => {
          const product = item.product;
          const imageUrl = product.image_url || "https://images.unsplash.com/photo-1523275335684-37898b6baf30";
          const rowPrice = parseFloat(item.price_at_purchase) * item.quantity;
          
          itemsHtml += `
            <div class="order-item-row">
              <div style="display: flex; align-items: center; gap: 12px; max-width: 80%;">
                <img src="${imageUrl}" alt="${product.name}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid var(--border);" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30'">
                <div>
                  <div style="font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px;">
                    <a href="product.html?id=${product.id}">${product.name}</a>
                  </div>
                  <div style="font-size: 12px; color: var(--text-secondary);">₹${parseFloat(item.price_at_purchase).toFixed(2)} x ${item.quantity}</div>
                </div>
              </div>
              <div style="font-weight: 600; font-size: 14px;">₹${rowPrice.toFixed(2)}</div>
            </div>
          `;
        });

        orderCard.innerHTML = `
          <!-- Header (clickable to toggle) -->
          <div class="order-header" data-id="${order.id}">
            <div class="order-summary-left">
              <span style="font-weight: 700; color: var(--primary);">${order.order_number}</span>
              <span style="font-size: 12px; color: var(--text-secondary);">${orderDate}</span>
            </div>
            
            <div class="order-summary-right">
              <div style="font-weight: 700; font-size: 15px;">₹${parseFloat(order.total).toFixed(2)}</div>
              <span class="status-badge ${statusClass}">${order.status}</span>
              <span class="accordion-arrow" style="font-size: 12px; transition: transform 0.2s;">&#9660;</span>
            </div>
          </div>

          <!-- Drawer Content (expands) -->
          <div class="order-details" id="drawer-${order.id}">
            <div style="margin-bottom: 20px;">
              <h4 style="font-size: 14px; text-transform: uppercase; margin-bottom: 10px; color: var(--text-secondary);">Items Ordered</h4>
              ${itemsHtml}
            </div>

            <hr style="border: 0; border-top: 1px solid #f1f3f4; margin: 15px 0;">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; font-size: 13px;">
              <!-- Shipping Details -->
              <div>
                <h4 style="font-size: 13px; text-transform: uppercase; margin-bottom: 8px; color: var(--text-secondary);">Shipping Details</h4>
                <div style="font-weight: 600;">${order.shipping_name}</div>
                <div>${order.shipping_address}</div>
                <div>${order.shipping_city}, ${order.shipping_state} - ${order.shipping_zip}</div>
                <div style="margin-top: 8px; font-style: italic;">Payment: ${order.payment_method}</div>
              </div>
              
              <!-- Total Breakdown -->
              <div style="display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;">
                <div style="display: flex; width: 100%; justify-content: space-between; max-width: 200px; margin-bottom: 4px;">
                  <span style="color: var(--text-secondary);">Subtotal:</span>
                  <span>₹${parseFloat(order.subtotal).toFixed(2)}</span>
                </div>
                ${order.promo_code ? `
                  <div style="display: flex; width: 100%; justify-content: space-between; max-width: 200px; margin-bottom: 4px; color: var(--success);">
                    <span>Promo (${order.promo_code}):</span>
                    <span>-₹${parseFloat(order.discount).toFixed(2)}</span>
                  </div>
                ` : ""}
                <div style="display: flex; width: 100%; justify-content: space-between; max-width: 200px; border-top: 1px solid var(--border); padding-top: 4px; font-weight: 700;">
                  <span>Total Paid:</span>
                  <span>₹${parseFloat(order.total).toFixed(2)}</span>
                </div>
              </div>
            </div>
          </div>
        `;

        container.appendChild(orderCard);
      });

      setupAccordionToggles();
    }

    function setupAccordionToggles() {
      const headers = document.querySelectorAll(".order-header");
      
      headers.forEach(header => {
        header.addEventListener("click", () => {
          const orderId = header.getAttribute("data-id");
          const drawer = document.getElementById(`drawer-${orderId}`);
          const arrow = header.querySelector(".accordion-arrow");
          
          const isOpen = drawer.classList.contains("open");
          
          // Toggle Open class
          if (isOpen) {
            drawer.classList.remove("open");
            arrow.style.transform = "rotate(0deg)";
          } else {
            drawer.classList.add("open");
            arrow.style.transform = "rotate(180deg)";
          }
        });
      });
    }
  </script>
</body>
</html>
