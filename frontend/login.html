<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared Navbar Wrapper -->
  <div id="navbar"></div>

  <div class="container">
    <div class="auth-container">
      <div class="card" style="background-color: #ffffff; padding: 30px;">
        <h2 style="text-align: center; margin-bottom: 20px;">Welcome Back</h2>
        
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" class="form-control" required placeholder="name@example.com">
          </div>
          
          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" class="form-control" required placeholder="••••••••">
          </div>
          
          <button type="submit" class="btn btn-primary btn-block" id="login-btn" style="padding: 12px; margin-top: 10px;">Sign In</button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; font-size: 14px;">
          Don't have an account? <a href="register.html">Register here</a>
        </p>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a> | 
      <a href="products.html">Products</a> | 
      <a href="cart.html">Cart</a> | 
      <a href="wishlist.html">Wishlist</a>
    </div>
    <p>&copy; 2026 ShopEasy Inc. All rights reserved.</p>
  </footer>

  <script src="api.js"></script>
  <script src="navbar.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // If already logged in, redirect to index
      if (getToken()) {
        window.location = "index.html";
        return;
      }

      document.getElementById("login-form").onsubmit = handleLogin;
    });

    async function handleLogin(e) {
      e.preventDefault();

      const emailVal = document.getElementById("login-email").value.trim();
      const passwordVal = document.getElementById("login-password").value;
      const btn = document.getElementById("login-btn");

      try {
        btn.disabled = true;
        btn.textContent = "Signing in...";

        const data = await apiFetch("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: emailVal,
            password: passwordVal
          })
        });

        if (data && data.access_token) {
          localStorage.setItem("token", data.access_token);
          // Store token type and user details
          localStorage.setItem("user", JSON.stringify({
            email: emailVal,
            role: data.role
          }));
          
          showToast("Login successful!", "success");
          
          setTimeout(() => {
            if (data.role === "admin") {
              window.location = "admin/index.html"; // Redirect admin to admin dashboard
            } else {
              window.location = "index.html"; // Redirect user to home page
            }
          }, 800);
        }

      } catch (err) {
        showToast("Login failed: " + err.message, "error");
        btn.disabled = false;
        btn.textContent = "Sign In";
      }
    }
  </script>
</body>
</html>
