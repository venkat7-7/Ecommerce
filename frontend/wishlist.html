<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - My Wishlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared Navbar Wrapper -->
  <div id="navbar"></div>

  <div class="container">
    <h2>My Wishlist</h2>

    <!-- Loading Spinner -->
    <div id="wishlist-loading" class="spinner"></div>
    <div id="wishlist-error" style="display: none; color: var(--danger); text-align: center; margin: 20px 0;"></div>

    <!-- Empty Wishlist Card -->
    <div id="wishlist-empty" class="card" style="display: none; text-align: center; padding: 40px; margin-top: 20px;">
      <p style="font-size: 16px; margin-bottom: 20px;">Your wishlist is empty.</p>
      <a href="products.html" class="btn btn-primary">Start Saving Products</a>
    </div>

    <!-- Wishlist Grid -->
    <div class="product-grid" id="wishlist-grid" style="display: none; margin-top: 25px;">
      <!-- JavaScript will inject cards here -->
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a> | 
      <a href="products.html">Products</a> | 
      <a href="cart.html">Cart</a> | 
      <a href="wishlist.html">Wishlist</a>
    </div>
    <p>&copy; 2026 ShopEasy Inc. All rights reserved.</p>
  </footer>

  <script src="api.js"></script>
  <script src="navbar.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (!getToken()) {
        showToast("Login required to view wishlist!", "error");
        setTimeout(() => { window.location = "login.html"; }, 1000);
        return;
      }

      loadWishlistPage();
    });

    async function loadWishlistPage() {
      const loader = document.getElementById("wishlist-loading");
      const errorEl = document.getElementById("wishlist-error");
      const emptyEl = document.getElementById("wishlist-empty");
      const gridEl = document.getElementById("wishlist-grid");

      try {
        const items = await apiFetch("/api/wishlist");
        loader.style.display = "none";

        if (!items || items.length === 0) {
          emptyEl.style.display = "block";
          gridEl.style.display = "none";
          return;
        }

        emptyEl.style.display = "none";
        renderWishlist(items);
        gridEl.style.display = "grid";

      } catch (err) {
        loader.style.display = "none";
        errorEl.textContent = "Failed to load wishlist: " + err.message;
        errorEl.style.display = "block";
      }
    }

    function renderWishlist(items) {
      const gridEl = document.getElementById("wishlist-grid");
      gridEl.innerHTML = "";

      items.forEach(item => {
        const prod = item.product;
        const card = document.createElement("div");
        card.className = "product-card";
        
        const imageUrl = prod.image_url || "https://images.unsplash.com/photo-1523275335684-37898b6baf30";
        const fullStars = Math.round(prod.avg_rating);
        let starsStr = "";
        for (let i = 1; i <= 5; i++) {
          starsStr += i <= fullStars ? "★" : "☆";
        }

        card.innerHTML = `
          <div class="product-card-img-wrapper">
            <a href="product.html?id=${prod.id}">
              <img src="${imageUrl}" alt="${prod.name}" class="product-card-img" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30'">
            </a>
          </div>
          <div class="product-card-body">
            <div class="product-card-category">${prod.category}</div>
            <a href="product.html?id=${prod.id}" style="color: inherit; text-decoration: none;">
              <h3 class="product-card-title">${prod.name}</h3>
            </a>
            <div class="product-card-rating">
              <span class="stars">${starsStr}</span>
              <span class="rating-count">(${prod.review_count})</span>
            </div>
            <div class="product-card-price" style="margin-bottom: 15px;">₹${parseFloat(prod.price).toFixed(2)}</div>
            
            <div style="display: flex; gap: 8px; margin-top: auto;">
              <button class="btn btn-primary move-cart-btn" data-id="${prod.id}" style="flex: 1; font-size: 12px; padding: 8px;">Move to Cart</button>
              <button class="btn btn-secondary remove-wish-btn" data-id="${prod.id}" style="font-size: 12px; padding: 8px; color: var(--danger); border-color: var(--border);">Remove</button>
            </div>
          </div>
        `;

        gridEl.appendChild(card);
      });

      setupWishlistActions();
    }

    function setupWishlistActions() {
      // Remove Button
      document.querySelectorAll(".remove-wish-btn").forEach(btn => {
        btn.onclick = async () => {
          const productId = parseInt(btn.getAttribute("data-id"));
          try {
            btn.disabled = true;
            await apiFetch(`/api/wishlist/${productId}`, {
              method: "DELETE"
            });
            showToast("Removed from wishlist", "info");
            await loadWishlistPage();
          } catch (err) {
            showToast("Failed to remove item: " + err.message, "error");
            btn.disabled = false;
          }
        };
      });

      // Move to Cart Button
      document.querySelectorAll(".move-cart-btn").forEach(btn => {
        btn.onclick = async () => {
          const productId = parseInt(btn.getAttribute("data-id"));
          try {
            btn.disabled = true;
            btn.textContent = "Moving...";
            
            // 1. Add to Cart
            await apiFetch("/api/cart", {
              method: "POST",
              body: JSON.stringify({ product_id: productId, quantity: 1 })
            });

            // 2. Remove from Wishlist
            await apiFetch(`/api/wishlist/${productId}`, {
              method: "DELETE"
            });

            showToast("Moved to cart successfully!", "success");
            
            // 3. Reload navbar badge and list
            if (window.updateNavbarCartBadge) await window.updateNavbarCartBadge();
            await loadWishlistPage();

          } catch (err) {
            showToast("Could not move to cart: " + err.message, "error");
            btn.disabled = false;
            btn.textContent = "Move to Cart";
          }
        };
      });
    }
  </script>
</body>
</html>
