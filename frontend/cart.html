<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy - Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared Navbar Wrapper -->
  <div id="navbar"></div>

  <div class="container">
    <h2>Your Shopping Cart</h2>

    <!-- Loading Spinner -->
    <div id="cart-loading" class="spinner"></div>
    <div id="cart-error" style="display: none; color: var(--danger); text-align: center; margin: 20px 0;"></div>

    <!-- Empty Cart Alert -->
    <div id="cart-empty-message" class="card" style="display: none; text-align: center; padding: 40px; margin-top: 20px;">
      <p style="font-size: 18px; margin-bottom: 20px;">Your cart is empty.</p>
      <a href="products.html" class="btn btn-primary">Start Shopping</a>
    </div>

    <!-- Cart Layout Grid -->
    <div id="cart-content-layout" class="cart-layout" style="display: none;">
      <!-- Cart Items List -->
      <div class="cart-table-container">
        <div id="cart-items-list">
          <!-- JavaScript will inject cart items here -->
        </div>
        
        <div style="margin-top: 20px; display: flex; justify-content: space-between;">
          <button class="btn btn-secondary" id="clear-cart-btn">Clear Entire Cart</button>
          <a href="products.html" class="btn btn-secondary">&larr; Continue Shopping</a>
        </div>
      </div>

      <!-- Order Summary Card -->
      <div class="cart-summary-card">
        <h3>Order Summary</h3>
        <hr style="border: 0; border-top: 1px solid var(--border); margin: 15px 0;">
        
        <div class="cart-summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">₹0.00</span>
        </div>
        
        <div class="cart-summary-row" id="discount-row" style="display: none; color: var(--success);">
          <span>Discount (<span id="discount-code-name"></span>)</span>
          <span id="summary-discount">-₹0.00</span>
        </div>
        
        <div class="cart-summary-row cart-summary-total">
          <span>Total</span>
          <span id="summary-total">₹0.00</span>
        </div>

        <!-- Promo Code Section -->
        <div style="margin: 25px 0 15px 0;">
          <label for="promo-input" style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px;">Have a Promo Code?</label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="promo-input" class="form-control" style="text-transform: uppercase;" placeholder="ENTER CODE">
            <button class="btn btn-secondary" id="apply-promo-btn">Apply</button>
          </div>
          <div id="promo-message" style="font-size: 12px; margin-top: 6px;"></div>
        </div>

        <button class="btn btn-primary btn-block" id="proceed-checkout-btn" style="padding: 12px;">Proceed to Checkout</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-links">
      <a href="index.html">Home</a> | 
      <a href="products.html">Products</a> | 
      <a href="cart.html">Cart</a> | 
      <a href="wishlist.html">Wishlist</a>
    </div>
    <p>&copy; 2026 ShopEasy Inc. All rights reserved.</p>
  </footer>

  <script src="api.js"></script>
  <script src="navbar.js"></script>

  <script>
    let cartData = null;
    let appliedPromo = null;

    document.addEventListener("DOMContentLoaded", () => {
      if (!getToken()) {
        showToast("Login required to access your cart!", "error");
        setTimeout(() => { window.location = "login.html"; }, 1000);
        return;
      }

      // Restore saved promo if exists
      const savedPromo = sessionStorage.getItem("applied_promo");
      if (savedPromo) {
        appliedPromo = JSON.parse(savedPromo);
      }

      loadCartPage();
    });

    async function loadCartPage() {
      const loader = document.getElementById("cart-loading");
      const errorEl = document.getElementById("cart-error");
      const emptyEl = document.getElementById("cart-empty-message");
      const layoutEl = document.getElementById("cart-content-layout");

      try {
        cartData = await apiFetch("/api/cart");
        loader.style.display = "none";

        if (!cartData || !cartData.items || cartData.items.length === 0) {
          emptyEl.style.display = "block";
          layoutEl.style.display = "none";
          // Clear session promo if cart is empty
          sessionStorage.removeItem("applied_promo");
          appliedPromo = null;
          return;
        }

        emptyEl.style.display = "none";
        renderCartItems(cartData.items);
        recomputeSummary();
        layoutEl.style.display = "grid";

        // Setup clear cart
        document.getElementById("clear-cart-btn").onclick = handleClearCart;
        // Setup promo
        document.getElementById("apply-promo-btn").onclick = handleApplyPromo;
        // Setup checkout redirect
        document.getElementById("proceed-checkout-btn").onclick = () => {
          window.location = "checkout.html";
        };

        if (appliedPromo) {
          document.getElementById("promo-input").value = appliedPromo.code;
          document.getElementById("promo-message").textContent = `Code ${appliedPromo.code} applied successfully!`;
          document.getElementById("promo-message").style.color = "var(--success)";
        }

      } catch (err) {
        loader.style.display = "none";
        errorEl.textContent = "Failed to load cart: " + err.message;
        errorEl.style.display = "block";
      }
    }

    function renderCartItems(items) {
      const container = document.getElementById("cart-items-list");
      container.innerHTML = "";

      items.forEach(item => {
        const row = document.createElement("div");
        row.className = "cart-item";
        
        const imageUrl = item.product.image_url || "https://images.unsplash.com/photo-1523275335684-37898b6baf30";
        const itemTotal = parseFloat(item.product.price) * item.quantity;

        row.innerHTML = `
          <div class="cart-item-details">
            <img class="cart-item-img" src="${imageUrl}" alt="${item.product.name}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30'">
            <div class="cart-item-info">
              <a href="product.html?id=${item.product.id}" style="color: inherit; text-decoration: none;">
                <h4>${item.product.name}</h4>
              </a>
              <div class="cart-item-price">₹${parseFloat(item.product.price).toFixed(2)}</div>
            </div>
          </div>
          <div class="cart-item-actions">
            <div class="qty-selector" style="height: 34px;">
              <button class="qty-btn dec-qty-btn" style="width: 34px; height: 34px;" data-id="${item.id}" data-qty="${item.quantity}">-</button>
              <input type="text" class="qty-input" style="width: 40px; height: 34px;" value="${item.quantity}" readonly>
              <button class="qty-btn inc-qty-btn" style="width: 34px; height: 34px;" data-id="${item.id}" data-qty="${item.quantity}" data-max="${item.product.stock_quantity}">+</button>
            </div>
            <div style="font-weight: 600; width: 100px; text-align: right;">₹${itemTotal.toFixed(2)}</div>
            <button class="btn btn-secondary remove-item-btn" data-id="${item.id}" style="padding: 6px 12px; color: var(--danger); border-color: var(--border);">Remove</button>
          </div>
        `;
        container.appendChild(row);
      });

      setupCartItemListeners();
    }

    function setupCartItemListeners() {
      // Quantity Minus
      document.querySelectorAll(".dec-qty-btn").forEach(btn => {
        btn.onclick = async () => {
          const itemId = parseInt(btn.getAttribute("data-id"));
          const currentQty = parseInt(btn.getAttribute("data-qty"));
          if (currentQty > 1) {
            await updateQuantity(itemId, currentQty - 1);
          } else {
            // Confirm delete
            if (confirm("Remove this item from your cart?")) {
              await removeCartItem(itemId);
            }
          }
        };
      });

      // Quantity Plus
      document.querySelectorAll(".inc-qty-btn").forEach(btn => {
        btn.onclick = async () => {
          const itemId = parseInt(btn.getAttribute("data-id"));
          const currentQty = parseInt(btn.getAttribute("data-qty"));
          const maxStock = parseInt(btn.getAttribute("data-max"));
          if (currentQty < maxStock) {
            await updateQuantity(itemId, currentQty + 1);
          } else {
            showToast("Cannot exceed available stock quantity!", "error");
          }
        };
      });

      // Remove Button
      document.querySelectorAll(".remove-item-btn").forEach(btn => {
        btn.onclick = async () => {
          const itemId = parseInt(btn.getAttribute("data-id"));
          if (confirm("Remove this item from your cart?")) {
            await removeCartItem(itemId);
          }
        };
      });
    }

    async function updateQuantity(itemId, newQty) {
      try {
        await apiFetch(`/api/cart/${itemId}`, {
          method: "PUT",
          body: JSON.stringify({ quantity: newQty })
        });
        showToast("Cart updated!", "success");
        await loadCartPage();
        if (window.updateNavbarCartBadge) await window.updateNavbarCartBadge();
      } catch (err) {
        showToast("Failed to update cart: " + err.message, "error");
      }
    }

    async function removeCartItem(itemId) {
      try {
        await apiFetch(`/api/cart/${itemId}`, {
          method: "DELETE"
        });
        showToast("Item removed!", "info");
        await loadCartPage();
        if (window.updateNavbarCartBadge) await window.updateNavbarCartBadge();
      } catch (err) {
        showToast("Failed to remove item: " + err.message, "error");
      }
    }

    async function handleClearCart() {
      if (confirm("Are you sure you want to clear your entire cart?")) {
        try {
          await apiFetch("/api/cart", {
            method: "DELETE"
          });
          showToast("Cart cleared!", "info");
          await loadCartPage();
          if (window.updateNavbarCartBadge) await window.updateNavbarCartBadge();
        } catch (err) {
          showToast("Failed to clear cart: " + err.message, "error");
        }
      }
    }

    function recomputeSummary() {
      if (!cartData) return;
      
      const subtotal = cartData.total;
      document.getElementById("summary-subtotal").textContent = `₹${parseFloat(subtotal).toFixed(2)}`;

      let discount = 0;
      const discountRow = document.getElementById("discount-row");
      const discountCodeName = document.getElementById("discount-code-name");
      const summaryDiscount = document.getElementById("summary-discount");

      if (appliedPromo) {
        // Re-evaluate discount locally if needed or just use values stored
        const type = appliedPromo.discount_type;
        const val = parseFloat(appliedPromo.discount_value);
        const minAmt = parseFloat(appliedPromo.min_order_amount);
        const maxDisc = appliedPromo.max_discount ? parseFloat(appliedPromo.max_discount) : null;

        if (subtotal >= minAmt) {
          if (type === "percent") {
            discount = subtotal * (val / 100);
            if (maxDisc !== null && discount > maxDisc) {
              discount = maxDisc;
            }
          } else if (type === "flat") {
            discount = val;
          }
          discount = Math.min(discount, subtotal);
          
          discountRow.style.display = "flex";
          discountCodeName.textContent = appliedPromo.code;
          summaryDiscount.textContent = `-₹${discount.toFixed(2)}`;
          // save/update correct local discount in sessionStorage
          appliedPromo.discount_amount = discount;
          sessionStorage.setItem("applied_promo", JSON.stringify(appliedPromo));
        } else {
          // Subtotal fell below threshold, invalidate promo
          sessionStorage.removeItem("applied_promo");
          appliedPromo = null;
          discountRow.style.display = "none";
          document.getElementById("promo-message").textContent = `Code invalidated: Minimum subtotal required is ₹${minAmt}`;
          document.getElementById("promo-message").style.color = "var(--danger)";
        }
      } else {
        discountRow.style.display = "none";
      }

      const total = subtotal - discount;
      document.getElementById("summary-total").textContent = `₹${total.toFixed(2)}`;
    }

    async function handleApplyPromo() {
      const codeInput = document.getElementById("promo-input");
      const messageEl = document.getElementById("promo-message");
      const code = codeInput.value.trim().toUpperCase();

      if (!code) {
        showToast("Please enter a promo code", "error");
        return;
      }

      try {
        messageEl.textContent = "Validating...";
        messageEl.style.color = "var(--text-secondary)";

        const res = await apiFetch("/api/orders/validate-promo", {
          method: "POST",
          body: JSON.stringify({
            promo_code: code,
            subtotal: cartData.total
          })
        });

        appliedPromo = {
          code: res.code,
          discount_type: res.discount_type,
          discount_value: res.discount_value,
          min_order_amount: res.min_order_amount || 0.0,
          max_discount: res.max_discount || null,
          discount_amount: res.discount_amount
        };

        // Save to session
        sessionStorage.setItem("applied_promo", JSON.stringify(appliedPromo));
        
        messageEl.textContent = `Promo code ${code} applied! Saved ₹${parseFloat(res.discount_amount).toFixed(2)}`;
        messageEl.style.color = "var(--success)";
        showToast("Promo code applied!", "success");
        
        recomputeSummary();
      } catch (err) {
        sessionStorage.removeItem("applied_promo");
        appliedPromo = null;
        messageEl.textContent = err.message;
        messageEl.style.color = "var(--danger)";
        showToast("Failed to apply promo: " + err.message, "error");
        recomputeSummary();
      }
    }
  </script>
</body>
</html>
